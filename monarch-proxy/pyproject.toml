[project]
name = "monarch-proxy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp", "httpx", "httpx2", "turn-contract"]

[project.scripts]
monarch-login = "monarch_proxy.login:main"

[tool.uv.sources]
turn-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monarch_proxy"]
