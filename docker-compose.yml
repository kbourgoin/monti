name: monti

services:
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    restart: unless-stopped
    environment:
      MODE: json-rpc
    volumes:
      - ./data/signal:/home/.local/share/signal-cli
    # No published ports. For registration see docs/runbooks/signal-registration.md.

  gateway:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        PACKAGE: gateway
    restart: unless-stopped
    # From the host env only USERS, the bot's number/uuid and DEFAULT_AGENT (no env_file, so no API key).
    environment:
      USERS: ${USERS}
      BOT_NUMBER: ${BOT_NUMBER}
      BOT_UUID: ${BOT_UUID:-}
      DEFAULT_AGENT: ${DEFAULT_AGENT:-pi}
      SIGNAL_URL: http://signal-cli:8080
      AGENTS: echo=http://agent-echo:8201,pi=http://agent-pi:8202,deep=http://agent-deep:8203
      DB_PATH: /app/data/gateway/gateway.db
    volumes:
      - ./data/gateway:/app/data/gateway
    depends_on:
      - signal-cli
      - agent-echo
      - agent-pi
      - agent-deep

  agent-echo:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        PACKAGE: agent-echo
    restart: unless-stopped
    environment:
      AGENT_HOST: 0.0.0.0

  agent-pi:
    build:
      context: .
      dockerfile: agents/pi/Dockerfile
    restart: unless-stopped
    # From the host env only ANTHROPIC_API_KEY and MODEL (no env_file).
    environment:
      AGENT_HOST: 0.0.0.0
      MONARCH_MCP_URL: http://monarch-proxy:8100/mcp
      PI_DATA_DIR: /app/data/agents/pi
      SYSTEM_PROMPT_PATH: /app/prompts/system.md
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MODEL: ${MODEL:-claude-sonnet-5-5}
    volumes:
      - ./data/agents/pi:/app/data/agents/pi
      - ./prompts:/app/prompts:ro
    depends_on:
      - monarch-proxy

  agent-deep:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        PACKAGE: agent-deep
    restart: unless-stopped
    # From the host env only ANTHROPIC_API_KEY and MODEL (no env_file).
    environment:
      AGENT_HOST: 0.0.0.0
      MONARCH_MCP_URL: http://monarch-proxy:8100/mcp
      DEEP_DATA_DIR: /app/data/agents/deep
      SYSTEM_PROMPT_PATH: /app/prompts/system.md
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MODEL: ${MODEL:-claude-sonnet-5-5}
    volumes:
      - ./data/agents/deep:/app/data/agents/deep
      - ./prompts:/app/prompts:ro
    depends_on:
      - monarch-proxy

  monarch-proxy:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        PACKAGE: monarch-proxy
    restart: unless-stopped
    environment:
      PROXY_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./data/monarch:/app/data/monarch
      - ./data/logs:/app/data/logs
