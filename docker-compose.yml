name: monty

services:
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    restart: unless-stopped
    environment:
      MODE: json-rpc
    volumes:
      - ./data/signal:/home/.local/share/signal-cli
    # No published ports. For registration see docs/runbooks/signal-registration.md.

  gateway:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        PACKAGE: gateway
    restart: unless-stopped
    env_file: .env
    environment:
      SIGNAL_URL: http://signal-cli:8080
      DEFAULT_AGENT: pi
      AGENTS: echo=http://agent-echo:8201,pi=http://agent-pi:8202
      DB_PATH: /app/data/gateway.db
    volumes:
      - ./data:/app/data
    depends_on:
      - signal-cli
      - agent-echo
      - agent-pi

  agent-echo:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        PACKAGE: agent-echo
    restart: unless-stopped
    environment:
      AGENT_HOST: 0.0.0.0

  agent-pi:
    build:
      context: ./agents/pi
    restart: unless-stopped
    # From the host env only ANTHROPIC_API_KEY and MODEL (no env_file).
    environment:
      AGENT_HOST: 0.0.0.0
      MONARCH_MCP_URL: http://monarch-proxy:8100/mcp
      PI_DATA_DIR: /app/data/agents/pi
      SYSTEM_PROMPT_PATH: /app/prompts/system.md
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MODEL: ${MODEL:-claude-sonnet-5-5}
    volumes:
      - ./data/agents/pi:/app/data/agents/pi
      - ./prompts:/app/prompts:ro
    depends_on:
      - monarch-proxy

  monarch-proxy:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        PACKAGE: monarch-proxy
    restart: unless-stopped
    environment:
      PROXY_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./data/monarch:/app/data/monarch
      - ./data/logs:/app/data/logs
