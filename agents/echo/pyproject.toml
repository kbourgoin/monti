[project]
name = "agent-echo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "turn-contract"]

[project.scripts]
agent-echo = "agent_echo.app:main"

[tool.uv.sources]
turn-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_echo"]
