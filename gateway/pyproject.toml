[project]
name = "gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["turn-contract", "httpx", "websockets"]

[project.scripts]
gateway = "gateway.app:main"

[tool.uv.sources]
turn-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
